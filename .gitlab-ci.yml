stages:
  - render

# Renders the HyperFrames promo to MP4 inside GitLab CI.
# Download results from the job page: Job artifacts > Browse / Download.
.render_base:
  stage: render
  image: node:22-bookworm
  variables:
    npm_config_yes: "true"
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    CHROME_PATH: /usr/bin/chromium
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ffmpeg chromium fonts-noto-core fonts-liberation ca-certificates
    - cd munaza-physio-video
    - mkdir -p renders
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - munaza-physio-video/renders/
    expire_in: 30 days
  interruptible: true
  timeout: 30m
  rules:
    - changes:
        - munaza-physio-video/**/*
        - .gitlab-ci.yml

render:en:
  extends: .render_base
  script:
    - npm run render

render:ur:
  extends: .render_base
  script:
    - npm run render:ur
