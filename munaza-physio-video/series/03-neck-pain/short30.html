/* Brand tokens: explicit theme selectors so dark and light never overwrite each other */
#stage[data-theme="dark"]{--bg-primary:#000000;--bg-secondary:#0D0D0D;--cap-fg:#FFFFFF}
#stage[data-theme="light"]{--bg-primary:#FFFFFF;--bg-secondary:#FAFAFA;--cap-fg:#FFFFFF}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}

.kc{position:absolute;left:90px;right:90px;bottom:300px;text-align:center;transform-origin:50% 100%;font:900 80px/1.12 "Inter";letter-spacing:-0.01em;color:var(--cap-fg);-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}

.kc span.on{color:var(--color-primary);transform:scale(1.08)}
